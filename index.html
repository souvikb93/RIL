<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n-title="login.title">EmPowerPlan – Sign in</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/tokens.css?v=202610131124">
  <link rel="stylesheet" href="css/login.css?v=202610131124">
</head>
<body>
  <div class="auth">
    <!-- Left: animation only (same pattern as FarmDoc) -->
    <div class="auth-left" aria-hidden="true">
      <div class="anim-wrap">
        <div id="animStage" class="anim-stage"></div>
        <!-- Shown until assets/login-animation.json is added -->
        <svg id="animFallback" class="anim-fallback" viewBox="0 0 400 400">
          <circle cx="300" cy="110" r="38" fill="#FFD800" opacity=".55"/>
          <path d="M0 300 Q100 250 200 285 T400 270 V400 H0Z" fill="#bccbd4"/>
          <path d="M0 330 Q120 300 230 320 T400 315 V400 H0Z" fill="#8aa3b1"/>
          <g class="turbine">
            <path d="M150 300 L154 140 L158 300Z" fill="#56778a"/>
            <g class="rotor" style="transform-origin:154px 140px">
              <path d="M152 140 154 66 156 140Z" fill="#214152"/>
              <path d="M152 140 154 66 156 140Z" fill="#214152" transform="rotate(120 154 140)"/>
              <path d="M152 140 154 66 156 140Z" fill="#214152" transform="rotate(240 154 140)"/>
              <circle cx="154" cy="140" r="5" fill="#214152"/>
            </g>
          </g>
          <g class="turbine">
            <path d="M246 296 L249 190 L252 296Z" fill="#56778a"/>
            <g class="rotor slow" style="transform-origin:249px 190px">
              <path d="M247.5 190 249 140 250.5 190Z" fill="#214152"/>
              <path d="M247.5 190 249 140 250.5 190Z" fill="#214152" transform="rotate(120 249 190)"/>
              <path d="M247.5 190 249 140 250.5 190Z" fill="#214152" transform="rotate(240 249 190)"/>
              <circle cx="249" cy="190" r="4" fill="#214152"/>
            </g>
          </g>
          <g class="panels" fill="#037E9E">
            <path d="M60 352 l40 -14 h34 l-40 14Z"/>
            <path d="M104 352 l40 -14 h34 l-40 14Z"/>
            <path d="M148 352 l40 -14 h34 l-40 14Z"/>
          </g>
          <path d="M296 330 h3 v-22 h-3Z M280 318 l17 -14 17 14Z" fill="#56778a" opacity=".7"/>
        </svg>
      </div>
    </div>

    <!-- Right: sign-in options -->
    <div class="auth-right">
      <div class="auth-card">
        <div class="auth-hdr">
        <div class="auth-brand">
          <span class="mark" aria-hidden="true"><img src="assets/logo-mark.png" alt=""></span>
          <span class="auth-brand-name">EmPower<span class="brand-plan">Plan</span></span>
        </div>
        <div class="lang-dd" id="langDd"></div>
        </div>

        <h1 class="auth-title" data-i18n="login.welcome">Welcome back</h1>
        <p class="auth-sub" data-i18n="login.sub">Sign in to your account to continue.</p>

        <form id="loginForm" novalidate>
          <label class="flbl" for="loginEmail" data-i18n="login.email">Email</label>
          <input id="loginEmail" type="email" placeholder="name@example.com" data-i18n-ph="login.emailPh" autocomplete="email">
          <button class="btn primary block auth-ctl" type="submit" data-i18n="login.continue">Continue with email</button>
        </form>

        <div class="auth-divider"><span data-i18n="login.or">or</span></div>

        <button class="btn-oauth auth-ctl" type="button" data-enter>
          <svg viewBox="0 0 18 18" width="20" height="20" aria-hidden="true">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908C16.658 14.078 17.64 11.77 17.64 9.2z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/>
          </svg>
          <span data-i18n="login.google">Sign in with Google</span>
        </button>
        <button class="btn-oauth auth-ctl" type="button" data-enter>
          <svg width="15" height="20" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          <span data-i18n="login.apple">Sign in with Apple</span>
        </button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lottie-web@5.12.2/build/player/lottie.min.js"></script>
  <script src="js/i18n.js?v=202610131124"></script>
  <script src="js/login.js?v=202610131124"></script>
</body>
</html>
